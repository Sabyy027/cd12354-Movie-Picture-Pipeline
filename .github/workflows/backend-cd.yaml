name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/backend:$IMAGE_TAG ./starter/backend
          docker push $ECR_REGISTRY/backend:$IMAGE_TAG

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name cluster

      - name: Deploy backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -k starter/backend/k8s
          kubectl set image deployment/backend backend=$ECR_REGISTRY/backend:$IMAGE_TAG
          kubectl rollout status deployment/backend --timeout=180s

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s || true
          echo "----- Logging - kubectl get all ---- "
          kubectl get all
          echo "----- Logging - kubectl describe deploy ----- "
          kubectl describe deploy backend

      - name: Verify Backend ECR image
        run: |
          echo "----- Logging - Backend ECR Image Details ----- "
          AWS_PAGER="" aws ecr describe-images \
            --repository-name backend \
            --region us-east-1 \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' \
            --output table